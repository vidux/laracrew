# Publish laracrew to npm. Manual only: Actions > publish > Run workflow.
#
#   "publish" unticked: the full test matrix, then `npm publish --dry-run` — a rehearsal.
#   "publish" ticked:   the full test matrix, publish with provenance, push the `v<version>` tag.
#
# Authentication is npm trusted publishing (OIDC): no token, no secret. On npmjs.com the
# `laracrew` package lists this repo as a trusted publisher — provider GitHub Actions, owner
# `vidux`, repository `laracrew`, workflow filename `publish.yml` (must match this file's name
# exactly). If an environment name is set there too, add `environment: <name>` to the publish
# job. The exchange needs `id-token: write` and npm CLI 11.5.1 or newer.

name: publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm for real. Unticked = rehearsal with `npm publish --dry-run`.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-publish

permissions:
  contents: read

jobs:
  test:
    # The same matrix every push gets; a release never skips it.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    name: ${{ inputs.publish && 'publish to npm' || 'rehearse publish (dry run)' }}
    # Only this repository may publish: a fork that runs this workflow stops here, by name,
    # rather than failing later at the OIDC exchange.
    if: github.repository == 'vidux/laracrew'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release tag after a real publish
      id-token: write # --provenance signs the tarball against this workflow run
    env:
      REAL: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      # Pinned to a commit, not a tag, with the tag kept as a comment for Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1+; the npm bundled with Node may be older.
      - run: npm install -g npm@latest

      - run: npm ci

      # Refuse to ship the wrong thing: a version with no CHANGELOG entry (CHANGELOG.md ships
      # inside the tarball), or a version npm already has.
      - name: Check the release
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"
            exit 1
          fi

          PUBLISHED="$(npm view "laracrew@$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            if [ "$REAL" = "true" ]; then
              echo "::error::laracrew $VERSION is already on npm — bump the version in package.json"
              exit 1
            fi
            echo "::warning::laracrew $VERSION is already on npm; a real publish of this version would fail"
          fi

          if [ "$REAL" = "true" ]; then
            echo "publishing laracrew $VERSION"
          else
            echo "rehearsing laracrew $VERSION (dry run)"
          fi

      # The token exchange npm performs internally, done up front. When npm's own exchange is
      # refused it falls back to setup-node's placeholder token and the publish dies with a
      # misleading 404, so surface the registry's real reason here before anything is built.
      - name: Check trusted publishing
        shell: bash
        run: |
          ID_TOKEN="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).value")"
          STATUS="$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/laracrew")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::npm refused the trusted-publishing token exchange (HTTP $STATUS): $(cat exchange.json)"
            rm -f exchange.json
            exit 1
          fi
          rm -f exchange.json # holds a short-lived publish token; never print it
          echo "trusted publishing: token exchange accepted for laracrew"

      # `npm publish` runs prepublishOnly (typecheck, test, build) itself — the same gate the
      # release checklist requires — then packs from the `files` allowlist. Auth comes from the
      # OIDC exchange with npmjs.com; nothing to pass here.
      - name: Publish
        run: npm publish --provenance --access public ${{ env.REAL != 'true' && '--dry-run' || '' }}

      # Create the tag at the commit that was just released so the CHANGELOG's release links
      # resolve. A push made with GITHUB_TOKEN does not trigger other workflows. The tagger
      # identity is the Actions bot's own noreply address (41898282 is its user id), so GitHub
      # links the tag to that account.
      - name: Tag the release
        if: env.REAL == 'true'
        shell: bash
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "laracrew ${{ steps.release.outputs.version }}"
          git push origin "$TAG"
          echo "pushed $TAG"
