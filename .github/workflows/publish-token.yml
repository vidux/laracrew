# Publish laracrew to npm with a granular access token. Manual only:
# Actions > publish (token) > Run workflow.
#
# The stopgap twin of publish.yml: the same test gate, release checks and tag push, but
# authenticated with the NPM_TOKEN secret instead of trusted publishing, because npm's OIDC
# exchange still rejects this repository's immutable subject claims
# (https://github.com/npm/cli/issues/9969). Keep the two files in step; delete this one and the
# secret as soon as a rehearsal run of publish.yml gets past "Check trusted publishing".
#
#   "publish" unticked: the full test matrix, then `npm publish --dry-run` — a rehearsal.
#   "publish" ticked:   the full test matrix, publish with provenance, push the `v<version>` tag.
#
# Setup: on npmjs.com create a Granular Access Token, read and write on `laracrew`, with
# "Bypass two-factor authentication" ticked, and store it as the NPM_TOKEN repository secret
# (Settings > Secrets and variables > Actions). The package's publishing-access setting must
# stay on the option that allows bypass-2FA tokens. Such tokens lose direct publish around
# January 2027; if npm has not fixed the exchange by then, the remaining route is
# `npm stage publish` plus a 2FA approval on npmjs.com.

name: publish (token)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm for real. Unticked = rehearsal with `npm publish --dry-run`.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }} # shared with publish.yml: one release at a time
  cancel-in-progress: false # never cancel a release mid-publish

permissions:
  contents: read

jobs:
  test:
    # The same matrix every push gets; a release never skips it.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    name: ${{ inputs.publish && 'publish to npm (token)' || 'rehearse publish (dry run, token)' }}
    # Only this repository may publish: a fork that runs this workflow stops here, by name.
    if: github.repository == 'vidux/laracrew'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release tag after a real publish
      id-token: write # provenance signing still uses the GitHub OIDC token
    env:
      REAL: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      # Pinned to a commit, not a tag, with the tag kept as a comment for Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's trusted-publishing docs: never cache in a release build

      # Same npm as publish.yml, so the two files differ only in how they authenticate.
      - run: npm install -g npm@latest

      - run: npm ci

      # Refuse to ship the wrong thing: no token to publish with, a version with no CHANGELOG
      # entry (CHANGELOG.md ships inside the tarball), or a version npm already has.
      - name: Check the release
        id: release
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is not set — see the header of this workflow for how to create it"
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"
            exit 1
          fi

          PUBLISHED="$(npm view "laracrew@$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            if [ "$REAL" = "true" ]; then
              echo "::error::laracrew $VERSION is already on npm — bump the version in package.json"
              exit 1
            fi
            echo "::warning::laracrew $VERSION is already on npm; a real publish of this version would fail"
          fi

          if [ "$REAL" = "true" ]; then
            echo "publishing laracrew $VERSION with the NPM_TOKEN secret"
          else
            echo "rehearsing laracrew $VERSION (dry run)"
          fi

      # `npm publish` runs prepublishOnly (typecheck, test, build) itself — the same gate the
      # release checklist requires — then packs from the `files` allowlist. npm still tries the
      # OIDC exchange first; this file's name is not the trusted publisher's, so that is refused
      # and the token is used, which is the point of this workflow.
      - name: Publish
        run: npm publish --provenance --access public ${{ env.REAL != 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the tag at the commit that was just released so the CHANGELOG's release links
      # resolve. A push made with GITHUB_TOKEN does not trigger other workflows. The tagger
      # identity is the Actions bot's own noreply address (41898282 is its user id), so GitHub
      # links the tag to that account.
      - name: Tag the release
        if: env.REAL == 'true'
        shell: bash
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "laracrew ${{ steps.release.outputs.version }}"
          git push origin "$TAG"
          echo "pushed $TAG"
