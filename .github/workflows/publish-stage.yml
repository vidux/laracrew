# Stage laracrew on npm with a granular access token; you approve it on npmjs.com.
# Manual only: Actions > publish (stage) > Run workflow.
#
# Nothing goes live from here. `npm stage publish` parks the version in the package's staging
# area, and it is published only when you approve it with your 2FA — on npmjs.com under the
# package's "Staged Packages" tab, or locally with `npm stage approve`. Reject it there instead
# and it is removed.
#
#   "stage" unticked: the full test matrix, then `npm stage publish --dry-run` — a rehearsal.
#   "stage" ticked:   the full test matrix, stage with provenance, push the `v<version>` tag.
#
# This is the stopgap twin of publish.yml, which cannot authenticate until npm accepts this
# repository's immutable OIDC subject claims (https://github.com/npm/cli/issues/9969). Same
# test gate, same release checks, same tag push; only the credential and the last step differ.
#
# Setup: on npmjs.com create a Granular Access Token, read and write on `laracrew` — staging
# never needs the "bypass 2FA" option, so leave it off — and store it as the NPM_TOKEN
# repository secret (Settings > Secrets and variables > Actions > Repository secrets).
#
# The tag is pushed when the version is staged, because the staged tarball is exactly this
# commit. If you reject the staged version, delete the tag: git push origin :refs/tags/v<version>

name: publish (stage)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage on npm for real. Unticked = rehearsal with `npm stage publish --dry-run`.'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }} # shared with publish.yml: one release at a time
  cancel-in-progress: false # never cancel a release mid-way

permissions:
  contents: read

jobs:
  test:
    # The same matrix every push gets; a release never skips it.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  stage:
    name: ${{ inputs.stage && 'stage on npm' || 'rehearse staging (dry run)' }}
    # Only this repository may release: a fork that runs this workflow stops here, by name.
    if: github.repository == 'vidux/laracrew'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release tag once the version is staged
      id-token: write # provenance signing uses the GitHub OIDC token
    env:
      REAL: ${{ inputs.stage && 'true' || 'false' }}
    steps:
      # Pinned to a commit, not a tag, with the tag kept as a comment for Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's trusted-publishing docs: never cache in a release build

      # Staged publishing needs npm 11.15.0+; the npm bundled with Node may be older.
      - run: npm install -g npm@latest

      - run: npm ci

      # Refuse to ship the wrong thing: no token to stage with, a version with no CHANGELOG
      # entry (CHANGELOG.md ships inside the tarball), or a version npm already has. A version
      # that is already *staged* is not visible to `npm view`; `npm stage publish` refuses it
      # itself with a clear message.
      - name: Check the release
        id: release
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is not set — see the header of this workflow for how to create it"
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"
            exit 1
          fi

          PUBLISHED="$(npm view "laracrew@$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            if [ "$REAL" = "true" ]; then
              echo "::error::laracrew $VERSION is already on npm — bump the version in package.json"
              exit 1
            fi
            echo "::warning::laracrew $VERSION is already on npm; staging this version would fail"
          fi

          if [ "$REAL" = "true" ]; then
            echo "staging laracrew $VERSION"
          else
            echo "rehearsing laracrew $VERSION (dry run)"
          fi

      # `npm stage publish` runs prepublishOnly (typecheck, test, build) and prepack exactly as
      # `npm publish` does — verified with a local dry run — then packs from the `files`
      # allowlist and parks the version in the staging area. It goes live only when approved.
      - name: Stage on npm
        run: npm stage publish --provenance --access public ${{ env.REAL != 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the tag at the commit that was just staged so the CHANGELOG's release links
      # resolve once the version is approved. A push made with GITHUB_TOKEN does not trigger
      # other workflows. The tagger identity is the Actions bot's own noreply address (41898282
      # is its user id), so GitHub links the tag to that account.
      - name: Tag the release
        if: env.REAL == 'true'
        shell: bash
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "laracrew ${{ steps.release.outputs.version }}"
          git push origin "$TAG"
          echo "pushed $TAG"

      - name: What happens next
        if: env.REAL == 'true'
        shell: bash
        run: |
          {
            echo "## laracrew ${{ steps.release.outputs.version }} is staged — not published yet"
            echo
            echo "Approve it with your 2FA on <https://www.npmjs.com/package/laracrew> (Staged Packages tab),"
            echo "or locally with \`npm stage list laracrew\` and then \`npm stage approve\`."
            echo
            echo "Rejecting it there removes it; then delete the tag:"
            echo "\`git push origin :refs/tags/v${{ steps.release.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
